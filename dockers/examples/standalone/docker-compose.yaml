version: '3.9'

services:
  teable:
    image: ghcr.io/teableio/teable:latest
    restart: always
    ports:
      - '3000:3000'
    volumes:
      - teable-data:/app/.assets:rw
    environment:
      - TZ=${TIMEZONE}
      - NEXT_ENV_IMAGES_ALL_REMOTE=${NEXT_ENV_IMAGES_ALL_REMOTE}
      - TEABLE_ORIGIN=${TEABLE_ORIGIN}
      - BACKEND_STORAGE_PROVIDER=minio
      - BACKEND_STORAGE_MINIO_ENDPOINT=${BACKEND_STORAGE_MINIO_ENDPOINT}
      - BACKEND_STORAGE_MINIO_PORT=${BACKEND_STORAGE_MINIO_PORT}
      - BACKEND_STORAGE_MINIO_USE_SSL=true
      - BACKEND_STORAGE_MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - BACKEND_STORAGE_MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - BACKEND_STORAGE_PUBLIC_BUCKET=${BACKEND_STORAGE_PUBLIC_BUCKET}
      - BACKEND_STORAGE_PRIVATE_BUCKET=${BACKEND_STORAGE_PRIVATE_BUCKET}
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - teable-standalone
    depends_on:
      teable-db-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  teable-db:
    image: postgres:15.4
    restart: always
    ports:
      - '127.0.0.1:42346:5432'
    volumes:
      - teable-db:/var/lib/postgresql/data:rw
    environment:
      - TZ=${TIMEZONE}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - teable-standalone
    healthcheck:
      test: ['CMD-SHELL', "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 3

  teable-db-migrate:
    image: ghcr.io/teableio/teable-db-migrate:latest
    environment:
      - TZ=${TIMEZONE}
      - PRISMA_DATABASE_URL=${PRISMA_DATABASE_URL}
    networks:
      - teable-standalone
    depends_on:
      teable-db:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
      - /etc/letsencrypt/live/${MINIO_SERVER_HOST}/fullchain.pem:/root/.minio/certs/public.crt:ro
      - /etc/letsencrypt/live/${MINIO_SERVER_HOST}/privkey.pem:/root/.minio/certs/private.key:ro
    command: server /data --console-address ":9001" --certs-dir /root/.minio/certs
    healthcheck:
      test: ["CMD", "curl", "-f", "https://${MINIO_SERVER_HOST}:${BACKEND_STORAGE_MINIO_PORT}/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - teable-standalone

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio https://${MINIO_SERVER_HOST}:${BACKEND_STORAGE_MINIO_PORT} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/public || true;
      /usr/bin/mc mb myminio/private || true;
      /usr/bin/mc mb myminio/teable-cache || true;
      exit 0;
      "
    networks:
      - teable-standalone

  coolify-realtime:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: coolify-realtime
    restart: always
    ports:
      - "3001:3001"
    networks:
      - teable-standalone

networks:
  teable-standalone:
    name: teable-standalone-network
    driver: bridge

volumes:
  teable-data: {}
  teable-db: {}
  minio-data: {}
