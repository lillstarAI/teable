version: '3.9'

services:
  teable:
    image: ghcr.io/teableio/teable:latest
    restart: always
    ports:
      - '3000:3000'
    volumes:
      - teable-data:/app/.assets:rw
      # - ./docker/teable/data:/app/.assets:rw  # Uncomment to use bind mount
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-Europe/Stockholm}
      - NEXT_ENV_IMAGES_ALL_REMOTE=true
      - DATABASE_URL=${PRISMA_DATABASE_URL}
    networks:
      - teable-standalone
    depends_on:
      teable-db:
        condition: service_healthy
      teable-db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["sh", "-c", "pnpm g:build && node apps/nestjs-backend/dist/index.js"]

  teable-db:
    image: postgres:15.4
    restart: always
    ports:
      - '42345:5432'
    volumes:
      - teable-db:/var/lib/postgresql/data:rw
      # - ./docker/db/data:/var/lib/postgresql/data:rw  # Uncomment to use bind mount
    environment:
      - TZ=${TIMEZONE:-Europe/Stockholm}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - teable-standalone
    healthcheck:
      test: ['CMD-SHELL', "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: 
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "shared_buffers=1GB"

  teable-db-migrate:
    image: ghcr.io/teableio/teable-db-migrate:latest
    environment:
      - TZ=${TIMEZONE:-Europe/Stockholm}
      - PRISMA_DATABASE_URL=${PRISMA_DATABASE_URL}
    networks:
      - teable-standalone
    depends_on:
      teable-db:
        condition: service_healthy
    command: ["sh", "-c", "sleep 10 && node /prisma/scripts/db-migrate.mjs"]

networks:
  teable-standalone:
    name: teable-standalone-network
    driver: bridge

volumes:
  teable-data: {}
  teable-db: {}
