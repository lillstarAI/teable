version: '3.9'

services:
  teable:
    build:
      context: .
      dockerfile: dockers/teable/Dockerfile
      args:
        NODE_VERSION: 20.9.0
        BUILD_VERSION: "1.0.0-beta"
        ENABLE_CSP: "true"
        SENTRY_ENABLED: "true"
        SENTRY_TRACING: "true"
    image: teable:latest
    restart: always
    expose:
      - '3000'
      - '3001'
    volumes:
      - teable_data:/app/.assets
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE}
      - NODE_ENV=production
      - PORT=${PORT}
      - SOCKET_PORT=${SOCKET_PORT}
      - NEXTJS_DIR=${NEXTJS_DIR}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - BRAND_NAME=${BRAND_NAME}
      - NEXT_ENV_IMAGES_ALL_REMOTE=${NEXT_ENV_IMAGES_ALL_REMOTE}
      - API_DOC_ENABLED_SNIPPET=${API_DOC_ENABLED_SNIPPET}
      - I18NEXT_DEFAULT_CONFIG_PATH=${I18NEXT_DEFAULT_CONFIG_PATH}
      - LOG_LEVEL=${LOG_LEVEL}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - SENTRY_DSN=${SENTRY_DSN}
      - APP_CACHE_DSN=${APP_CACHE_DSN}
      - NEXT_BUILD_ENV_OUTPUT=${NEXT_BUILD_ENV_OUTPUT}
      - NEXT_BUILD_ENV_SOURCEMAPS=${NEXT_BUILD_ENV_SOURCEMAPS}
      - NEXT_BUILD_ENV_CSP=${NEXT_BUILD_ENV_CSP}
      - NEXT_BUILD_ENV_SENTRY_ENABLED=${NEXT_BUILD_ENV_SENTRY_ENABLED}
      - NEXT_BUILD_ENV_SENTRY_UPLOAD_DRY_RUN=${NEXT_BUILD_ENV_SENTRY_UPLOAD_DRY_RUN}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
      - ASSET_PREFIX=${ASSET_PREFIX}
    networks:
      - teable-standalone
    depends_on:
      redis:
        condition: service_healthy
      teable-db:
        condition: service_healthy

  teable-db:
    image: 'postgres:15.4'
    restart: always
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - TZ=${TIMEZONE}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - teable-standalone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: 'redis:alpine'
    restart: always
    expose:
      - '6379'
    networks:
      - teable-standalone
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  minio:
    image: minio/minio
    restart: always
    expose:
      - '9000'
      - '9001'
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: 'server --console-address ":9001" /data'
    healthcheck:
      test: ["CMD", "curl", "-f", "https://minio-server.teable.se:9001/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
    networks:
      - teable-standalone

networks:
  teable-standalone:
    name: teable-standalone-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  teable_data: